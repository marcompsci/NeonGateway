<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 440" width="1280" height="440" role="img" aria-label="Neon Getaway — Port Aurora beta">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0B0C10"/>
      <stop offset="0.55" stop-color="#1d1230"/>
      <stop offset="1" stop-color="#3a1640"/>
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFD25E"/>
      <stop offset="0.5" stop-color="#FF8A3D"/>
      <stop offset="1" stop-color="#FF3EA5"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#14161C"/>
      <stop offset="1" stop-color="#0B0C10"/>
    </linearGradient>
    <clipPath id="sunCut">
      <rect x="0" y="0" width="1280" height="214"/>
      <rect x="0" y="219" width="1280" height="9"/>
      <rect x="0" y="234" width="1280" height="7"/>
      <rect x="0" y="247" width="1280" height="5"/>
      <rect x="0" y="257" width="1280" height="4"/>
      <rect x="0" y="265" width="1280" height="3"/>
    </clipPath>
    <filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="2.5"/>
    </filter>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="2" fill="#000" opacity="0.18"/>
    </pattern>
  </defs>

  <!-- sky -->
  <rect width="1280" height="440" fill="url(#sky)"/>
  <!-- stars -->
  <g fill="#F4EBD9" opacity="0.7">
    <rect x="84" y="40" width="3" height="3"/><rect x="212" y="92" width="2" height="2"/>
    <rect x="330" y="30" width="3" height="3"/><rect x="980" y="48" width="3" height="3"/>
    <rect x="1104" y="106" width="2" height="2"/><rect x="1196" y="36" width="3" height="3"/>
    <rect x="760" y="22" width="2" height="2"/><rect x="520" y="64" width="2" height="2"/>
  </g>

  <!-- sun -->
  <circle cx="640" cy="200" r="118" fill="url(#sun)" clip-path="url(#sunCut)"/>
  <circle cx="640" cy="200" r="118" fill="#FF3EA5" opacity="0.25" filter="url(#soft)" clip-path="url(#sunCut)"/>

  <!-- skyline -->
  <g fill="#0B0C10">
    <rect x="0" y="210" width="60" height="70"/><rect x="58" y="180" width="44" height="100"/>
    <rect x="100" y="226" width="70" height="54"/><rect x="168" y="160" width="36" height="120"/>
    <rect x="202" y="200" width="58" height="80"/><rect x="258" y="232" width="80" height="48"/>
    <rect x="336" y="190" width="40" height="90"/><rect x="374" y="244" width="90" height="36"/>
    <rect x="816" y="240" width="90" height="40"/><rect x="904" y="196" width="42" height="84"/>
    <rect x="944" y="220" width="64" height="60"/><rect x="1006" y="168" width="38" height="112"/>
    <rect x="1042" y="206" width="70" height="74"/><rect x="1110" y="186" width="46" height="94"/>
    <rect x="1154" y="230" width="66" height="50"/><rect x="1218" y="200" width="62" height="80"/>
  </g>
  <!-- lit windows -->
  <g fill="#2EE6D6" opacity="0.85">
    <rect x="68" y="196" width="6" height="6"/><rect x="84" y="214" width="6" height="6"/>
    <rect x="178" y="178" width="6" height="6"/><rect x="190" y="206" width="6" height="6"/>
    <rect x="344" y="206" width="6" height="6"/><rect x="914" y="212" width="6" height="6"/>
    <rect x="1016" y="186" width="6" height="6"/><rect x="1028" y="226" width="6" height="6"/>
    <rect x="1120" y="204" width="6" height="6"/><rect x="1230" y="216" width="6" height="6"/>
  </g>
  <g fill="#FF3EA5" opacity="0.85">
    <rect x="216" y="216" width="6" height="6"/><rect x="232" y="240" width="6" height="6"/>
    <rect x="958" y="236" width="6" height="6"/><rect x="1056" y="222" width="6" height="6"/>
    <rect x="1168" y="246" width="6" height="6"/><rect x="118" y="240" width="6" height="6"/>
  </g>

  <!-- ground + perspective grid -->
  <rect x="0" y="280" width="1280" height="160" fill="url(#ground)"/>
  <line x1="0" y1="280" x2="1280" y2="280" stroke="#FF3EA5" stroke-width="3" filter="url(#glow)"/>
  <g stroke="#FF3EA5" stroke-width="1.6" opacity="0.55">
    <line x1="0" y1="296" x2="1280" y2="296"/><line x1="0" y1="318" x2="1280" y2="318"/>
    <line x1="0" y1="348" x2="1280" y2="348"/><line x1="0" y1="390" x2="1280" y2="390"/>
    <line x1="640" y1="280" x2="640" y2="440"/>
    <line x1="560" y1="280" x2="320" y2="440"/><line x1="720" y1="280" x2="960" y2="440"/>
    <line x1="480" y1="280" x2="0" y2="440"/><line x1="800" y1="280" x2="1280" y2="440"/>
    <line x1="400" y1="280" x2="-320" y2="440"/><line x1="880" y1="280" x2="1600" y2="440"/>
  </g>

  <!-- getaway car (top-down, pixel) -->
  <g transform="translate(612 352)">
    <rect x="-6" y="40" width="68" height="16" fill="#FF3EA5" opacity="0.35" filter="url(#soft)"/>
    <rect x="0" y="0" width="56" height="74" rx="6" fill="#2EE6D6"/>
    <rect x="8" y="14" width="40" height="16" fill="#0B0C10"/>
    <rect x="8" y="46" width="40" height="12" fill="#0B0C10"/>
    <rect x="2" y="2" width="10" height="5" fill="#F4EBD9"/><rect x="44" y="2" width="10" height="5" fill="#F4EBD9"/>
    <rect x="2" y="68" width="10" height="4" fill="#FF3EA5"/><rect x="44" y="68" width="10" height="4" fill="#FF3EA5"/>
  </g>

  <!-- title -->
  <g font-family="'Press Start 2P','Silkscreen','Courier New',ui-monospace,monospace" font-weight="700" text-anchor="middle">
    <text x="640" y="118" font-size="78" fill="#0B0C10" stroke="#0B0C10" stroke-width="14" stroke-linejoin="round" letter-spacing="6">NEON</text>
    <text x="640" y="200" font-size="78" fill="#0B0C10" stroke="#0B0C10" stroke-width="14" stroke-linejoin="round" letter-spacing="6">GETAWAY</text>
    <text x="640" y="118" font-size="78" fill="#FF3EA5" filter="url(#glow)" letter-spacing="6">NEON</text>
    <text x="640" y="200" font-size="78" fill="#2EE6D6" filter="url(#glow)" letter-spacing="6">GETAWAY</text>
  </g>
  <!-- tag -->
  <g font-family="'Courier New',ui-monospace,monospace" font-weight="700">
    <rect x="40" y="36" width="250" height="36" fill="#0B0C10" stroke="#FF8A3D" stroke-width="2"/>
    <text x="165" y="60" font-size="17" fill="#FF8A3D" text-anchor="middle" letter-spacing="2">PORT AURORA · v0.11</text>
    <rect x="1010" y="36" width="230" height="36" fill="#0B0C10" stroke="#2EE6D6" stroke-width="2"/>
    <text x="1125" y="60" font-size="17" fill="#2EE6D6" text-anchor="middle" letter-spacing="2">▶ BETA ON iPHONE</text>
  </g>

  <rect width="1280" height="440" fill="url(#scan)"/>
</svg>
